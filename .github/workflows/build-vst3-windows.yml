name: Build VST3 (Windows)

on:
  workflow_dispatch:

# All shipping plugins → one Windows job.
# One zip per product (*-win-vst3). Lucent + Lucent-Relay share one zip
# (Lucent's version), same pairing as the CLAP Lucent workflow.
# Bundle layout matches cargo-aura install_vst3 / Steinberg:
#   Name.vst3/Contents/x86_64-win/Name.vst3

jobs:
  build-windows-vst3:
    name: Windows VST3 (all plugins)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: windows-vst3-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: windows-vst3-

      - name: Build all plugins (VST3)
        shell: bash
        run: |
          set -euo pipefail
          plugs=(aether meridian equilibrium lucent lucent-relay)
          for p in "${plugs[@]}"; do
            echo "=== cargo build -p $p --features vst3 ==="
            cargo build --release --package "$p" \
              --no-default-features --features vst3
          done

      - name: Bundle + zip
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/bundled
          mkdir -p target/bundled

          pack_vst3() {
            local dll="$1" display="$2"
            local src="target/release/${dll}.dll"
            if [[ ! -f "$src" ]]; then
              echo "missing $src" >&2
              exit 1
            fi
            local bundle="target/bundled/${display}.vst3"
            local arch="${bundle}/Contents/x86_64-win"
            mkdir -p "$arch"
            cp "$src" "${arch}/${display}.vst3"
          }

          # Solo products: one .vst3 per zip, version from that crate.
          solos=(
            "aether|aether|Aether|plugins/aether/Cargo.toml"
            "meridian|meridian|Meridian|plugins/meridian/Cargo.toml"
            "equilibrium|equilibrium|Equilibrium|plugins/equilibrium/Cargo.toml"
          )
          for row in "${solos[@]}"; do
            IFS='|' read -r pkg dll display toml <<< "$row"
            version=$(grep '^version' "$toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            pack_vst3 "$dll" "$display"
            zipname="${pkg}-v${version}-win-vst3.zip"
            (cd target/bundled && tar -a -cf "$zipname" "${display}.vst3")
            echo "[OK] $zipname"
            echo "${pkg}_version=${version}" >> "$GITHUB_OUTPUT"
          done

          # Lucent pair — always one zip, version from Lucent only.
          lucent_ver=$(grep '^version' plugins/lucent/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          pack_vst3 lucent Lucent
          pack_vst3 lucent_relay Lucent-Relay
          zipname="lucent-v${lucent_ver}-win-vst3.zip"
          (cd target/bundled && tar -a -cf "$zipname" Lucent.vst3 Lucent-Relay.vst3)
          echo "[OK] $zipname (Lucent + Lucent-Relay)"
          echo "lucent_version=${lucent_ver}" >> "$GITHUB_OUTPUT"

          ls -la target/bundled/*.zip

      - name: Upload Aether
        uses: actions/upload-artifact@v6
        with:
          name: aether-v${{ steps.bundle.outputs.aether_version }}-win-vst3
          path: target/bundled/aether-v*-win-vst3.zip
          if-no-files-found: error

      - name: Upload Meridian
        uses: actions/upload-artifact@v6
        with:
          name: meridian-v${{ steps.bundle.outputs.meridian_version }}-win-vst3
          path: target/bundled/meridian-v*-win-vst3.zip
          if-no-files-found: error

      - name: Upload Equilibrium
        uses: actions/upload-artifact@v6
        with:
          name: equilibrium-v${{ steps.bundle.outputs.equilibrium_version }}-win-vst3
          path: target/bundled/equilibrium-v*-win-vst3.zip
          if-no-files-found: error

      - name: Upload Lucent (+ Relay)
        uses: actions/upload-artifact@v6
        with:
          name: lucent-v${{ steps.bundle.outputs.lucent_version }}-win-vst3
          path: target/bundled/lucent-v*-win-vst3.zip
          if-no-files-found: error
