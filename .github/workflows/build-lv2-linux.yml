name: Build LV2 (Linux)

on:
  workflow_dispatch:

# All shipping plugins → one Linux job.
# Build on ubuntu-22.04 so glibc stays ≤2.35 (ubuntu-latest links GLIBC_2.43+
# and fails to dlopen on many desktop distros).
# Upload a *parent* dir that contains Name.lv2/ so the download zip root is
# Name.lv2/… (path=Name.lv2 alone strips the folder name).
# Lucent + Lucent-Relay share one artifact (Lucent's version).

jobs:
  build-linux-lv2:
    name: Linux LV2 (all plugins)
    runs-on: ubuntu-22.04
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: linux-lv2-jammy-${{ hashFiles('**/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: linux-lv2-jammy-

      - name: Install build dependencies
        run: |
          sudo apt-get update -y || sudo apt-get update -y || true
          sudo apt-get install -y \
            pkg-config \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgles2-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libgl-dev

      - name: Build all plugins (LV2)
        run: |
          set -euo pipefail
          plugs=(aether meridian equilibrium lucent lucent-relay)
          for p in "${plugs[@]}"; do
            echo "=== cargo build -p $p --features lv2 ==="
            cargo build --release --package "$p" \
              --no-default-features --features lv2
          done

      - name: Emit LV2 TTL sidecars
        run: |
          set -euo pipefail
          plugs=(aether meridian equilibrium lucent lucent-relay)
          root="${GITHUB_WORKSPACE:-$PWD}"
          for p in "${plugs[@]}"; do
            out="${root}/target/release/${p}-lv2-ttl"
            mkdir -p "$out"
            echo "=== emit TTL $p → $out ==="
            LV2_TTL_OUT="$out" cargo test -p "$p" \
              --no-default-features --features lv2 --release \
              tests::writes_lv2_ttl_sidecar -- --exact --nocapture
            test -f "$out/manifest.ttl"
            test -f "$out/plugin.ttl"
          done

      - name: Bundle LV2 trees
        id: bundle
        run: |
          set -euo pipefail
          rm -rf target/bundled target/artifacts
          mkdir -p target/bundled

          pack_lv2() {
            local pkg="$1" so="$2" display="$3"
            local src="target/release/${so}"
            local ttl="target/release/${pkg}-lv2-ttl"
            if [[ ! -f "$src" ]]; then
              echo "missing $src" >&2
              exit 1
            fi
            if [[ ! -f "$ttl/manifest.ttl" || ! -f "$ttl/plugin.ttl" ]]; then
              echo "missing TTL in $ttl" >&2
              exit 1
            fi
            local bundle="target/bundled/${display}.lv2"
            mkdir -p "$bundle"
            cp "$src" "$bundle/$so"
            cp "$ttl/manifest.ttl" "$ttl/plugin.ttl" "$bundle/"
            echo "[OK] $bundle"
          }

          # Parent dir keeps Name.lv2 as zip root under upload-artifact.
          stage() {
            local art="$1"
            shift
            local dest="target/artifacts/${art}"
            mkdir -p "$dest"
            for name in "$@"; do
              cp -a "target/bundled/${name}" "$dest/"
            done
          }

          solos=(
            "aether|libaether.so|Aether|plugins/aether/Cargo.toml"
            "meridian|libmeridian.so|Meridian|plugins/meridian/Cargo.toml"
            "equilibrium|libequilibrium.so|Equilibrium|plugins/equilibrium/Cargo.toml"
          )
          for row in "${solos[@]}"; do
            IFS='|' read -r pkg so display toml <<< "$row"
            version=$(grep '^version' "$toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            pack_lv2 "$pkg" "$so" "$display"
            stage "${pkg}-v${version}-lin-lv2" "${display}.lv2"
            echo "${pkg}_version=${version}" >> "$GITHUB_OUTPUT"
          done

          lucent_ver=$(grep '^version' plugins/lucent/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          pack_lv2 lucent liblucent.so Lucent
          pack_lv2 lucent-relay liblucent_relay.so Lucent-Relay
          stage "lucent-v${lucent_ver}-lin-lv2" Lucent.lv2 Lucent-Relay.lv2
          echo "lucent_version=${lucent_ver}" >> "$GITHUB_OUTPUT"

          find target/artifacts -type f | sort
          grep -c 'lv2:ControlPort' target/bundled/Aether.lv2/plugin.ttl | awk \
            '$1 > 1 { ok=1 } END { if (!ok) { print "Aether TTL looks like fallback"; exit 1 } }'
          grep -q 'libaether\.so' target/bundled/Aether.lv2/manifest.ttl
          # glibc sanity: jammy = 2.35. Match only 2.36+ (not 2.9 — that is older).
          if command -v objdump >/dev/null; then
            bad=$(objdump -T target/release/libaether.so 2>/dev/null \
              | grep -oE 'GLIBC_2\.[0-9]+' | sort -u \
              | awk -F. '{ if ($2+0 >= 36) print }' || true)
            if [[ -n "$bad" ]]; then
              echo "ERROR: binary needs glibc newer than ubuntu-22.04:" >&2
              echo "$bad" >&2
              exit 1
            fi
            echo "glibc symbols OK (no GLIBC_2.36+)"
            objdump -T target/release/libaether.so 2>/dev/null \
              | grep -oE 'GLIBC_2\.[0-9]+' | sort -u | tail -5
          fi

      - name: Upload Aether
        uses: actions/upload-artifact@v6
        with:
          name: aether-v${{ steps.bundle.outputs.aether_version }}-lin-lv2
          path: target/artifacts/aether-v${{ steps.bundle.outputs.aether_version }}-lin-lv2
          if-no-files-found: error

      - name: Upload Meridian
        uses: actions/upload-artifact@v6
        with:
          name: meridian-v${{ steps.bundle.outputs.meridian_version }}-lin-lv2
          path: target/artifacts/meridian-v${{ steps.bundle.outputs.meridian_version }}-lin-lv2
          if-no-files-found: error

      - name: Upload Equilibrium
        uses: actions/upload-artifact@v6
        with:
          name: equilibrium-v${{ steps.bundle.outputs.equilibrium_version }}-lin-lv2
          path: target/artifacts/equilibrium-v${{ steps.bundle.outputs.equilibrium_version }}-lin-lv2
          if-no-files-found: error

      - name: Upload Lucent (+ Relay)
        uses: actions/upload-artifact@v6
        with:
          name: lucent-v${{ steps.bundle.outputs.lucent_version }}-lin-lv2
          path: target/artifacts/lucent-v${{ steps.bundle.outputs.lucent_version }}-lin-lv2
          if-no-files-found: error
